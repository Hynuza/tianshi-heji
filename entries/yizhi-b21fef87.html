  <section><h2>各地记写</h2><ul class="cite-list"><li class="cite"><div class="book">《敖汉方言例释》</div><div class="form">写法：板过来</div><div class="gloss">改正过来。［举例］这孩子原来是左手使筷子，让我硬给板过来了</div></li><li class="cite"><div class="book">《蔚州方言词萃》</div><div class="form">写法：扳</div><div class="gloss">由‘改变（固有方向、位置等）’义引申为矫正、医治。[例]他小时候结巴得挺厉害，他爹叫他天天早起大声背唐诗，日子长了，慢慢就扳过来啦。｜前几年他患了心肌炎，咋治也治不好。后来碰见个老中医，给他每天开一剂中药，这么吃了半年多，终于扳过来了，这忽儿啥事也没了</div></li></ul></section>
