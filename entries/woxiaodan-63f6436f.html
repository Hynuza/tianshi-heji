  <section><h2>各地记写</h2><ul class="cite-list"><li class="cite"><div class="book">《阳城方言》</div><div class="form">写法：活拨剌剌</div><div class="gloss">犹如‘活生生’。例：才在水里捞出来，活拨剌剌的就撂进嘴里吃了。文化馆刘老师确实是个把势，他不论演甚，都能把他演得活拨剌剌的</div></li><li class="cite"><div class="book">《宣化方言》</div><div class="form">写法：活巴巴儿</div><div class="gloss">活得很好的动物。如：活巴巴儿的狗让汽车撞死了</div></li><li class="cite"><div class="book">《河南方言词语考释》</div><div class="form">写法：活不剌哩</div><div class="gloss">‘这活不剌哩鸡，我不敢杀，我小胆。’……元无名氏</div></li></ul></section>
