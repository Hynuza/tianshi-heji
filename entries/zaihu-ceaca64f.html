  <section><h2>各地记写</h2><ul class="cite-list"><li class="cite"><div class="book">《大同方言辞典》</div><div class="form">写法：不差乎 / 差乎</div><div class="gloss">不在乎。例：现在可不像过去，谁家也不差乎点吃的；在乎。例：这点钱对于他来说不差乎，人家有两辆车呢！有的区域‘差’读去声，差乎意谓欠，缺。也说‘差于’</div></li><li class="cite"><div class="book">《蔚州方言词萃》</div><div class="form">写法：差乎</div><div class="gloss">在乎，在意，介意。多用于否定形式。〔例〕咱们再穷，也不差乎他这一个人的吃食。｜这年月，谁还差乎那百二八十的</div></li></ul></section>
